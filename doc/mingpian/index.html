
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>专业软件开发服务</title>
    <style>
        /* 全局重置与基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 渐变背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* 蓝紫渐变 */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 卡片容器 */
        .card {
            background: rgba(255, 255, 255, 0.95); /* 微透明背景，让渐变透一点出来 */
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(10px); /* 毛玻璃效果 */
        }

        /* 业务标签样式 */
        .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 25px; }
        .tag {
            background: rgba(102, 126, 234, 0.1); /* 与背景呼应的微透明底色 */
            color: #5a67d8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* 电话按钮与呼吸特效 */
        .call-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); /* 按钮也使用渐变 */
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
            transition: transform 0.2s ease;
            animation: pulse 2s infinite;
        }
        .call-btn:active { transform: scale(0.98); }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(102, 126, 234, 0); }
            100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0); }
        }

        /* 二维码区域 */
        .qr-section p { font-size: 13px; color: #888; margin-bottom: 10px; }
        .qr-wrapper {
            display: inline-block;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .qr-wrapper:hover { border-color: #667eea; }
        .qr-wrapper img { width: 180px; height: 180px; display: block; border-radius: 4px; }

        /* 放大遮罩层 */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .overlay.show { display: flex; opacity: 1; }
        .overlay img { max-width: 85%; max-height: 85%; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 业务展示 -->
    <div class="tags">
        <span class="tag">网站开发</span>
        <span class="tag">小程序</span>
        <span class="tag">App开发</span>
        <span class="tag">爬虫</span>
        <span class="tag">AI应用</span>
        <span class="tag">数据可视化</span>
        <span class="tag">ERP/CRM系统</span>
        <span class="tag">SaaS平台搭建</span>
        <span class="tag">API接口开发</span>
        <span class="tag">AI大模型应用</span>
    </div>

    <!-- 一键拨号按钮 -->
    <a href="tel:1953743210" class="call-btn">📞 1953743210</a>

    <!-- 二维码区域 -->
    <div class="qr-section">
        <p>微信扫码添加好友</p>
        <div class="qr-wrapper" id="qrTrigger">
            <!-- 请将下方 src 替换为您真实的微信二维码图片路径 -->
            <img src="./images/20260903135501_2_1 suo.jpg" alt="微信二维码">
        </div>
    </div>
</div>

<!-- 二维码放大遮罩 -->
<div class="overlay" id="overlay">
    <img src="./images/20260903135501_2_1.jpg" alt="微信二维码放大">
</div>

<script>
    // 简单的二维码点击放大交互
    const trigger = document.getElementById('qrTrigger');
    const overlay = document.getElementById('overlay');

    trigger.addEventListener('click', () => {
        overlay.classList.add('show');
    });

    overlay.addEventListener('click', () => {
        overlay.classList.remove('show');
    });
</script>

</body>
</html>
