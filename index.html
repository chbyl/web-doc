<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试域名提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
            margin-bottom: 100px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #2d3748;
            font-weight: 600;
        }

        .message {
            font-size: 18px;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #cbd5e0, transparent);
            margin: 30px 0;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
        }

        /* 备案信息样式 */
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .beian {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
        }

        .beian a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: color 0.3s;
            margin: 0 10px;
        }

        .beian a:hover {
            color: white;
            text-decoration: underline;
        }

        .beian-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
            font-size: 10px;
            line-height: 14px;
            text-align: center;
            color: #764ba2;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
                margin-bottom: 120px;
            }
            h1 {
                font-size: 24px;
            }
            .message {
                font-size: 16px;
            }
            .beian {
                font-size: 12px;
            }
            .beian a {
                display: block;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🧪</span>
        <h1>个人测试域名</h1>
        <div class="message">
            本域名仅为<strong>个人测试使用</strong><br>
            网站目前<strong>无实际内容</strong><br>
            请勿用于正式访问
        </div>
        <div class="divider"></div>
        <div class="badge">测试环境</div>
    </div>

    <!-- 备案信息 -->
    <footer class="footer">
        <div class="beian">
            <p>
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
                    豫ICP备17032463号-3
                </a>
                <span style="margin: 0 10px;">|</span>
                <a href="http://www.beian.gov.cn/portal/registerSystemInfo" target="_blank" rel="noopener noreferrer">
                    <span class="beian-icon">公</span>
                    豫公网安备41108202000913号
                </a>
            </p>
            <p style="margin-top: 8px; font-size: 12px; opacity: 0.7;">
                © 2024 个人测试站点 版权所有
            </p>
			<p style="display:none;">
                <a href="./doc/index.html" target="_blank" rel="noopener noreferrer">
                    文档
                </a>
            </p>
        </div>
    </footer>
</body>
</html>
